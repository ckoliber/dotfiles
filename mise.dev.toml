[bootstrap.packages]
"apt:git" = "latest"
"apt:bash" = "latest"
"apt:curl" = "latest"
"apt:wget" = "latest"
"apt:openssh-client" = "latest"
"apt:flatpak" = "latest"

"dnf:git" = "latest"
"dnf:bash" = "latest"
"dnf:curl" = "latest"
"dnf:wget" = "latest"
"dnf:openssh-clients" = "latest"
"dnf:flatpak" = "latest"

"pacman:git" = "latest"
"pacman:bash" = "latest"
"pacman:curl" = "latest"
"pacman:wget" = "latest"
"pacman:openssh" = "latest"
"pacman:flatpak" = "latest"

"zypper:git" = "latest"
"zypper:bash" = "latest"
"zypper:curl" = "latest"
"zypper:wget" = "latest"
"zypper:openssh" = "latest"
"zypper:flatpak" = "latest"

"flatpak:com.alacritty.Alacritty" = "latest"
"flatpak:com.bitwarden.desktop" = "latest"
"flatpak:com.vscodium.codium" = "latest"
"flatpak:com.brave.Browser" = "latest"
"flatpak:io.mpv.Mpv" = "latest"

"brew:git" = { os = "macos" }
"brew:bash" = { os = "macos" }
"brew:curl" = { os = "macos" }
"brew:wget" = { os = "macos" }
"brew:openssh" = { os = "macos" }
"brew-cask:alacritty" = { os = "macos" }
"brew-cask:bitwarden" = { os = "macos" }
"brew-cask:vscodium" = { os = "macos" }
"brew-cask:docker-desktop" = { os = "macos" }
"brew-cask:brave-browser" = { os = "macos" }
"brew-cask:mpv" = { os = "macos" }

"winget:Git.Git" = "latest"
"winget:JernejSimoncic.Wget" = "latest"
"winget:Microsoft.OpenSSH.Beta" = "latest"
"winget:Alacritty.Alacritty" = "latest"
"winget:Bitwarden.Bitwarden" = "latest"
"winget:VSCodium.VSCodium" = "latest"
"winget:Docker.DockerDesktop" = "latest"
"winget:Brave.Brave" = "latest"
"winget:mpv.net" = "latest"

[bootstrap.hooks.post-packages]
run = """
if [ "$(uname -s)" = Linux ]; then
  command -v docker >/dev/null || curl -fsSL https://get.docker.com | sh
  if command -v flatpak >/dev/null && ! flatpak remotes | grep -q flathub; then
    sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
    mise bootstrap packages apply --yes
  fi
fi
"""
run_windows = "exit 0"

[bootstrap.repos]
"~/.vim" = { url = "https://github.com/morhetz/gruvbox.git" }

[dotfiles]
"~/.vimrc" = "configs/.vimrc"
"~/.bashrc" = "configs/.bashrc"
"~/.profile" = "configs/.profile"
"~/.zprofile" = "configs/.profile"
"~/.tmux.conf" = { source = "configs/.tmux.conf", mode = "template" }
"~/.config/starship.toml" = "configs/starship.toml"
"~/.config/git/dotfiles.gitconfig" = "configs/gitconfig"

[dotfiles."~/.config/mise/mise.toml"]
content = '''
[env]
SOPS_AGE_KEY_FILE = "{{ env.HOME }}/.config/sops/age.txt"

[tools]
jq = "1.8.1"
yq = "4.52.4"
gh = "2.92.0"
shfmt = "3.13.1"
vim = "9.2.1252"
tmux = { version = "3.8", os = ["linux", "macos"] }
"github:marlocarlo/psmux" = { version = "3.4.0", os = ["windows"] }
starship = "1.27.0"
codex = "0.166.0"
claude = "2.1.308"
opencode = "1.17.17"
kubelogin = "1.36.1"
kubectl = "1.36.1"
k9s = "0.50.18"

[settings]
experimental = true
'''

[dotfiles."fonts/*.ttf"]
source = "fonts/*.ttf"
mode = "copy"
variants = [
  { os = "macos", target = "~/Library/Fonts/*.ttf" },
  { os = "linux", target = "~/.local/share/fonts/*.ttf" },
  { os = "windows", target = "~/AppData/Local/Microsoft/Windows/Fonts/*.ttf" },
]

[dotfiles."configs/alacritty.toml.tpl"]
source = "configs/alacritty.toml.tpl"
mode = "template"
variants = [
  { os = "macos", target = "~/.config/alacritty/alacritty.toml" },
  { os = "linux", target = "~/.var/app/com.alacritty.Alacritty/config/alacritty/alacritty.toml" },
  { os = "windows", target = "~/AppData/Roaming/alacritty/alacritty.toml" },
]

[dotfiles."configs/vscode/settings.json"]
source = "configs/vscode/settings.json"
variants = [
  { os = "macos", target = "~/Library/Application Support/VSCodium/User/settings.json" },
  { os = "linux", target = "~/.var/app/com.vscodium.codium/config/VSCodium/User/settings.json" },
  { os = "windows", target = "~/AppData/Roaming/VSCodium/User/settings.json" },
]

[dotfiles."configs/vscode/keybindings.json"]
source = "configs/vscode/keybindings.json"
variants = [
  { os = "macos", target = "~/Library/Application Support/VSCodium/User/keybindings.json" },
  { os = "linux", target = "~/.var/app/com.vscodium.codium/config/VSCodium/User/keybindings.json" },
  { os = "windows", target = "~/AppData/Roaming/VSCodium/User/keybindings.json" },
]

[tasks.bootstrap]
shell = "bash -c"
run = '''
set -euo pipefail

[ -f ~/.ssh/id_rsa ] || { mkdir -p ~/.ssh && ssh-keygen -t rsa -b 4096 -C "$(hostname)" -f ~/.ssh/id_rsa -N ""; }

git config --global --replace-all --fixed-value include.path '~/.config/git/dotfiles.gitconfig' '~/.config/git/dotfiles.gitconfig'

case "$(uname -s)" in
Linux)
  ALACRITTY=~/.var/app/com.alacritty.Alacritty/config/alacritty
  ;;
Darwin)
  xattr -r -d com.apple.quarantine /Applications/Alacritty.app 2>/dev/null || true
  ALACRITTY=~/.config/alacritty
  ;;
*)
  powershell -NoProfile -Command 'Get-ChildItem "$env:LOCALAPPDATA\Microsoft\Windows\Fonts\*.ttf" | ForEach-Object { New-ItemProperty -Path "HKCU:\Software\Microsoft\Windows NT\CurrentVersion\Fonts" -Name "$($_.BaseName) (TrueType)" -Value $_.FullName -Force | Out-Null }'
  setx MSYS2_PATH_TYPE inherit >/dev/null
  powershell -NoProfile -Command '$lnk="C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Alacritty\Alacritty.lnk"; if (Test-Path $lnk) { $ws=New-Object -ComObject WScript.Shell; $sc=$ws.CreateShortcut($lnk); $sc.WorkingDirectory=$env:USERPROFILE; $sc.Save() }'
  ALACRITTY=~/AppData/Roaming/alacritty
  ;;
esac

if command -v alacritty >/dev/null && [ ! -f "$ALACRITTY/size.toml" ]; then
  read -r rows columns < <(alacritty -v -o 'window.startup_mode="Maximized"' -e echo | awk '/PTY dimensions:/{print $7, $9}')
  printf '[window]\ndimensions = { lines = %d, columns = %d }\n' $((rows * 2 / 3)) "$columns" >"$ALACRITTY/size.toml"
fi

if command -v codium >/dev/null; then
  sed 's/\r$//; s/^/--install-extension /' configs/vscode/extensions.txt | xargs codium
fi
'''
