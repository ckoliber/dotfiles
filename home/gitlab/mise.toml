[env]
GITLAB_HOST = "https://gitlab.com"
GLAB_CONFIG_DIR = "{{config_root}}/.config/glab"

[tools]
glab = "1.131.0"

[tasks.setup]
description = "Log in to GitLab and set up this machine's SSH key and the git identity from the account"
shell = "bash -euo pipefail -c"
run = """
key="{{config_root}}/.config/ssh/id_ed25519"
gitconfig="{{config_root}}/.config/git/config"
glab auth status >/dev/null 2>&1 || glab auth login --web --git-protocol ssh
mkdir -p "$(dirname "$key")" "$(dirname "$gitconfig")"
[ -f "$key" ] || ssh-keygen -q -t ed25519 -N "" -C "$(hostname)" -f "$key"
pub=$(cut -d' ' -f1,2 "$key.pub")
glab api user/keys | jq -r '.[].key' | cut -d' ' -f1,2 | grep -xF "$pub" >/dev/null || glab ssh-key add "$key.pub" --title "$(hostname)"
git config -f "$gitconfig" user.name "$(glab api user | jq -r '.name // .username')"
git config -f "$gitconfig" user.email "$(glab api user | jq -r '.commit_email // .email')"
git config -f "$gitconfig" user.signingkey "$key"
git config -f "$gitconfig" core.sshCommand "ssh -i $key -o IdentitiesOnly=yes"
git config --global "includeIf.gitdir:{{config_root}}/.path" "$gitconfig"
"""
