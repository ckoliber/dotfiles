[env]
GH_HOST = "github.com"
GH_CONFIG_DIR = "{{config_root}}/.config/gh"

[vars]
key = "{{config_root}}/.config/ssh/id_ed25519"
gitconfig = "{{config_root}}/.config/git/config"

[tools]
gh = "2.92.0"

[tasks.setup]
description = "Log in to GitHub and set up this machine's SSH key and the git identity from the account"
shell = "bash -euo pipefail -c"
run = '''
gh auth status >/dev/null 2>&1 || gh auth login --web --git-protocol ssh --skip-ssh-key --scopes admin:public_key,admin:ssh_signing_key
mkdir -p "$(dirname "{{vars.key}}")" "$(dirname "{{vars.gitconfig}}")"
[ -f "{{vars.key}}" ] || ssh-keygen -q -t ed25519 -N "" -C "$(hostname)" -f "{{vars.key}}"
pub=$(cut -d' ' -f1,2 "{{vars.key}}.pub")
scopes=$(gh auth status 2>&1)
[[ $scopes == *admin:public_key* && $scopes == *admin:ssh_signing_key* ]] || gh auth refresh --scopes admin:public_key,admin:ssh_signing_key
gh api user/keys --jq '.[].key' | cut -d' ' -f1,2 | grep -xF "$pub" >/dev/null || gh ssh-key add "{{vars.key}}.pub" --title "$(hostname)" --type authentication
gh api user/ssh_signing_keys --jq '.[].key' | cut -d' ' -f1,2 | grep -xF "$pub" >/dev/null || gh ssh-key add "{{vars.key}}.pub" --title "$(hostname)" --type signing
git config -f "{{vars.gitconfig}}" user.name "$(gh api user --jq '.name // .login')"
git config -f "{{vars.gitconfig}}" user.email "$(gh api user --jq '"\(.id)+\(.login)@users.noreply.github.com"')"
git config -f "{{vars.gitconfig}}" user.signingkey "{{vars.key}}"
git config -f "{{vars.gitconfig}}" core.sshCommand "ssh -i {{vars.key}} -o IdentitiesOnly=yes"
git config --global "includeIf.gitdir:{{config_root}}/.path" "{{vars.gitconfig}}"
'''
