[env]
SOPS_AGE_KEY_FILE = "{{ env.HOME }}/.config/sops/age.txt"

[tools]
jq = "1.8.1"
yq = "4.52.4"
vim = "9.2.1252"
shfmt = "3.13.1"
yamlfmt = "0.21.0"
starship = "1.27.0"
tmux = { version = "3.8", os = ["linux", "macos"] }
"github:marlocarlo/psmux" = { version = "3.4.0", os = ["windows"] }
codex = "0.166.0"
claude = "2.1.308"
opencode = "1.17.17"
kubelogin = "1.36.1"
kubectl = "1.36.1"
k9s = "0.50.18"

[settings]
experimental = true
trusted_config_paths = ["~/github", "~/gitea", "~/gitlab"]
