name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  cicd:
    uses: ckoliber/dotfiles/.github/workflows/mise.yml@main
    permissions:
      contents: read
    with:
      env: always
      script: |
        mise install
        mise tasks ls
        mise run renovate:check default.json .github/renovate.json
        mise exec actionlint@1.7.12 -- actionlint -ignore 'property "workflow_(repository|sha)" is not defined'
